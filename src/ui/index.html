<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Canvas Weekly</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><img class="brand-icon" src="assets/mark.svg" alt=""><div>Canvas Weekly<small>Your week, simplified.</small></div></div>
    <nav aria-label="Main navigation">
      <button data-page="week" class="nav-item selected"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="2" width="12" height="16" rx="1"/><path d="M7 6h6M7 10h6M7 14h4"/></svg>This week</button>
      <button data-page="courses" class="nav-item"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 3h4v14H2zM8 3h4v14H8zM14 3h4v14h-4zM2 6h4M8 6h4M14 6h4"/></svg>Courses</button>
      <button data-page="settings" class="nav-item"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M8.447 4.204L8.749 2.098L11.251 2.098L11.553 4.204A6 6 0 0 1 13 4.804L14.702 3.528L16.472 5.298L15.196 7A6 6 0 0 1 15.796 8.447L17.902 8.749L17.902 11.251L15.796 11.553A6 6 0 0 1 15.196 13L16.472 14.702L14.702 16.472L13 15.196A6 6 0 0 1 11.553 15.796L11.251 17.902L8.749 17.902L8.447 15.796A6 6 0 0 1 7 15.196L5.298 16.472L3.528 14.702L4.804 13A6 6 0 0 1 4.204 11.553L2.098 11.251L2.098 8.749L4.204 8.447A6 6 0 0 1 4.804 7L3.528 5.298L5.298 3.528L7 4.804A6 6 0 0 1 8.447 4.204Z"/><circle cx="10" cy="10" r="2.5"/></svg>Settings</button>
      <button data-page="privacy" class="nav-item"><svg class="nav-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m10 2 7 3v4c0 4-3 7-7 9-4-2-7-5-7-9V5zM6 10l3 3 5-6"/></svg>Data &amp; privacy</button>
    </nav>
    <section class="sidebar-bottom" aria-label="Connections and AI usage">
      <button id="connection-settings" class="connection-heading" aria-label="Manage connections in Settings">Connections <span aria-hidden="true">&#8250;</span></button>
      <div class="connection-row"><span>Canvas</span><button id="connection-status" class="connection-state" aria-label="Canvas: Not connected. Open connection settings">Not connected</button></div>
      <small id="canvas-collection-status" class="connection-note" hidden>Refresh paused</small>
      <div class="connection-row"><span>ChatGPT <small>via Codex</small></span><button id="ai-status" class="connection-state" aria-label="ChatGPT: Not connected. Open connection settings">Not connected</button></div>
      <div class="connection-row suggestions-row"><span>Study suggestions</span><span id="suggestions-status" class="connection-state">Off</span></div>
      <details class="ai-usage">
        <summary><span>AI tokens</span><strong id="ai-token-count">—</strong></summary>
        <small id="ai-usage-scope">No AI run this session</small>
        <dl id="ai-usage-breakdown" hidden></dl>
        <small id="ai-usage-subtotals" hidden>Cached input is included in input; reasoning is included in output.</small>
        <small>Canvas Weekly only. Account limits and billing are separate.</small>
      </details>
      <small id="ai-usage-caption" class="usage-caption">No AI run this session</small>
    </section>
  </aside>
  <main id="main"></main>
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
