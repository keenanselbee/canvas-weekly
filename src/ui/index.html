<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Canvas Weekly</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="brand-icon" aria-hidden="true">▦</span><div>Canvas Weekly<small>Your week, in view</small></div></div>
    <nav aria-label="Main navigation">
      <button data-page="week" class="nav-item selected"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h6"/></svg>This week</button>
      <button data-page="courses" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="8" y="4" width="5" height="16" rx="1"/><path d="m15 5 4-1 3 15-4 1zM5 8h1M10 8h1"/></svg>Courses</button>
      <button data-page="settings" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-1 3-3 1 1 3-2 2 2 2-1 3 3 1 1 3h6l1-3 3-1-1-3 2-2-2-2 1-3-3-1-1-3z"/><circle cx="12" cy="12" r="3"/></svg>Settings</button>
      <button data-page="privacy" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 3v5c0 5-4 8-8 10-4-2-8-5-8-10V6z"/><path d="m8 12 3 3 5-6"/></svg>Data &amp; privacy</button>
    </nav>
    <section class="sidebar-bottom" aria-label="Connections and AI usage">
      <button id="connection-settings" class="connection-heading" aria-label="Manage connections in Settings">Connections <span aria-hidden="true">&#8250;</span></button>
      <div class="connection-row"><span>Canvas</span><button id="connection-status" class="connection-state" aria-label="Canvas: Not connected. Open connection settings">Not connected</button></div>
      <small id="canvas-collection-status" class="connection-note" hidden>Refresh paused</small>
      <div class="connection-row"><span>ChatGPT <small>via Codex</small></span><button id="ai-status" class="connection-state" aria-label="ChatGPT: Not connected. Open connection settings">Not connected</button></div>
      <div class="connection-row suggestions-row"><span>Study suggestions</span><span id="suggestions-status" class="connection-state">Off</span></div>
      <details class="ai-usage">
        <summary><span>AI tokens</span><strong id="ai-token-count">—</strong></summary>
        <small id="ai-usage-scope">No AI run this session</small>
        <dl id="ai-usage-breakdown" hidden></dl>
        <small id="ai-usage-subtotals" hidden>Cached input is included in input; reasoning is included in output.</small>
        <small>Canvas Weekly only. Account limits and billing are separate.</small>
      </details>
      <small id="ai-usage-caption" class="usage-caption">No AI run this session</small>
    </section>
  </aside>
  <main id="main"></main>
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
